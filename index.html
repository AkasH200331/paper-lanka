<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Lanka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-blue-600 mb-6">Paper Lanka</h1>

        <button id="loginBtn" class="bg-blue-600 text-white px-4 py-2 rounded mb-4">Admin Login</button>

        <div id="papers" class="grid gap-4"></div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-96">
            <h2 class="text-xl font-bold mb-4">Admin Login</h2>
            <input id="user" type="text" placeholder="Username" class="w-full border p-2 mb-3 rounded">
            <input id="pass" type="password" placeholder="Password" class="w-full border p-2 mb-3 rounded">
            <button id="loginSubmit" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Login</button>
            <button id="closeLogin" class="bg-gray-300 px-4 py-2 rounded w-full mt-2">Cancel</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-full max-w-2xl">
            <h2 class="text-xl font-bold mb-4">Add Paper</h2>
            <div class="grid grid-cols-2 gap-3">
                <input id="grade" placeholder="Grade" class="border p-2 rounded">
                <input id="subject" placeholder="Subject" class="border p-2 rounded">
                <input id="year" placeholder="Year" class="border p-2 rounded">
                <input id="examType" placeholder="Exam Type" class="border p-2 rounded">
                <input id="medium" placeholder="Medium" class="border p-2 rounded">
                <input id="title" placeholder="Title" class="border p-2 rounded col-span-2">
                <input id="url" placeholder="PDF URL" class="border p-2 rounded col-span-2">
            </div>
            <button id="saveBtn" class="bg-green-600 text-white px-4 py-2 rounded mt-4">Save Paper</button>
            <button id="closeAdmin" class="bg-gray-300 px-4 py-2 rounded mt-4 ml-2">Close</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://gqgrhhayyzftxmewgrqf.supabase.co';
        const supabaseKey = 'sb_publishable_GiyRieOHtruTZ-l_fgk7Zg_kEkFuQ4W';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Load papers
        async function loadPapers() {
            const { data, error } = await supabase.from('papers').select('*');
            if (error) {
                console.log('Error:', error);
                document.getElementById('papers').innerHTML = 'Error: ' + error.message;
                return;
            }
            document.getElementById('papers').innerHTML = data.map(p =>
                `<div class="bg-white p-4 rounded shadow">
                    <h3 class="font-bold">${p.title}</h3>
                    <p>Grade ${p.grade} - ${p.subject} - ${p.year}</p>
                    <a href="${p.download_url}" target="_blank" class="text-blue-600">Download</a>
                </div>`
            ).join('');
        }

        // Admin login
        document.getElementById('loginBtn').onclick = () => {
            document.getElementById('loginModal').classList.remove('hidden');
        };

        document.getElementById('closeLogin').onclick = () => {
            document.getElementById('loginModal').classList.add('hidden');
        };

        document.getElementById('loginSubmit').onclick = () => {
            if (document.getElementById('user').value === 'admin' &&
                document.getElementById('pass').value === 'paper123') {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert('Wrong password');
            }
        };

        document.getElementById('closeAdmin').onclick = () => {
            document.getElementById('adminPanel').classList.add('hidden');
        };

        // Save paper
        document.getElementById('saveBtn').onclick = async () => {
            const paper = {
                grade: parseInt(document.getElementById('grade').value),
                subject: document.getElementById('subject').value,
                year: parseInt(document.getElementById('year').value),
                exam_type: document.getElementById('examType').value,
                medium: document.getElementById('medium').value,
                title: document.getElementById('title').value,
                download_url: document.getElementById('url').value
            };

            const { error } = await supabase.from('papers').insert([paper]);
            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Saved!');
                loadPapers();
                document.getElementById('adminPanel').classList.add('hidden');
            }
        };

        loadPapers();
    </script>
</body>
</html>
