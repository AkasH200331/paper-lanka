<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Lanka - Past Papers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">
    <!-- ඔයාගේ පරණ HTML එක මෙතනට දාන්න -->
    <!-- මම JS කොටස විතරක් update කරලා තියෙන්නේ Supabase එක්ක -->

    <script>
        // Supabase Config
        const SUPABASE_URL = 'https://gqgrhhayyzftxmewgrqf.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_GiyRieOHtruTZ-l_fgk7Zg_kEkFuQ4W';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Papers Load කරන Function එක
        async function loadPapers() {
            const { data: papers, error } = await supabase
               .from('papers')
               .select('*')
               .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading papers:', error);
                return;
            }
            
            // මෙතන ඔයාගේ පරණ table render කරන code එක දාන්න
            // උදා: displayPapers(papers);
            console.log('Papers loaded:', papers);
            renderPapersTable(papers); // ඔයාගේ function එකේ නම මේක නම්
        }

        // Paper එකක් Save කරන Function එක
        async function savePaper(paperData) {
            const { data, error } = await supabase
               .from('papers')
               .insert([paperData])
               .select();
            
            if (error) {
                alert('Save කරන්න බැරි වුනා: ' + error.message);
                return false;
            }
            
            alert('Paper එක Save වුනා!');
            loadPapers(); // Table එක refresh කරන්න
            return true;
        }

        // Paper එකක් Delete කරන Function එක
        async function deletePaper(id) {
            const { error } = await supabase
               .from('papers')
               .delete()
               .eq('id', id);
            
            if (error) {
                alert('Delete කරන්න බැරි වුනා: ' + error.message);
                return;
            }
            
            alert('Paper එක Delete වුනා!');
            loadPapers();
        }

        // Page load වෙනකොට papers ටික load කරන්න
        document.addEventListener('DOMContentLoaded', () => {
            loadPapers();
        });

        // ඔයාගේ පරණ code එකේ localStorage.setItem, getItem තියෙන තැන් ඔක්කොම අයින් කරලා
        // මේ savePaper(), loadPapers(), deletePaper() functions ටික use කරන්න
    </script>
</body>
</html>
